<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="CyberBen: aviation cybersafety and AI assurance, Tallinn.">

<title>cyberben.ai</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="theme-color" content="#0c1016" media="(prefers-color-scheme: dark)">

<style>
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500 600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/space-grotesk-latin-600-normal.woff2) format('woff2')}
/* Shared with cybersafety.aero: --dim = the site's --faint (light #5f6773, dark #8b929d), theme key cb-theme, device theme by default. */
/* Layout: one terminal on drafting-grid ink; a slim header with the rotor, a command strip for touch. Dark by default, a blueprint-paper light theme, switchable with `theme`. */
:root{
  --ink:#0c1016; --panel:#11161d; --line:#232a34; --grid:rgba(255,255,255,.035);
  --fg:#eef1f5; --body:#a9b0bb; --dim:#8b929d; --blue:#6f9bff; --y:#ffd23f; --yt:#ffd23f; --c:#27c6ff; --ok:#22c55e; --err:#f97066;
  --t1:#2a313c; --t2:#3a414c; --off:#151b23; --cb:#5b6a86; --sp:#3b4a66; --dimy:#7a5f0e; --shadow:rgba(0,0,0,.45);
  --elev:inset 0 1px 0 rgba(255,255,255,.045),0 1px 2px rgba(0,0,0,.4),0 10px 22px -8px rgba(0,0,0,.5),0 34px 70px -18px rgba(0,0,0,.65),0 70px 120px -40px rgba(0,0,0,.55);
  --mono:'IBM Plex Mono',Consolas,Menlo,monospace; --disp:'Space Grotesk',Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --ink:#eef1f5; --panel:#ffffff; --line:#d3d9e2; --grid:rgba(12,16,22,.05);
  --fg:#0c1016; --body:#3b4350; --dim:#5f6773; --blue:#2f5fe0; --y:#ffd23f; --yt:#a16a00; --c:#0a72a6; --ok:#15803d; --err:#c2362b;
  --t1:#c4ccd7; --t2:#a9b2bf; --off:#e6eaf0; --cb:#8a97ad; --sp:#b4c0d4; --dimy:#e9c25a; --shadow:rgba(12,16,22,.12);
  --elev:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(17,22,29,.07),0 8px 18px -6px rgba(17,22,29,.10),0 28px 56px -14px rgba(17,22,29,.16),0 60px 100px -36px rgba(17,22,29,.14);
  color-scheme:light}}
:root[data-theme="light"]{
  --ink:#eef1f5; --panel:#ffffff; --line:#d3d9e2; --grid:rgba(12,16,22,.05);
  --fg:#0c1016; --body:#3b4350; --dim:#5f6773; --blue:#2f5fe0; --y:#ffd23f; --yt:#a16a00; --c:#0a72a6; --ok:#15803d; --err:#c2362b;
  --t1:#c4ccd7; --t2:#a9b2bf; --off:#e6eaf0; --cb:#8a97ad; --sp:#b4c0d4; --dimy:#e9c25a; --shadow:rgba(12,16,22,.12);
  --elev:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(17,22,29,.07),0 8px 18px -6px rgba(17,22,29,.10),0 28px 56px -14px rgba(17,22,29,.16),0 60px 100px -36px rgba(17,22,29,.14);
  color-scheme:light}
body,.term{transition:background-color .3s,color .3s}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--body);font-family:var(--mono);font-size:14px;line-height:1.65;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;background-position:center top}
.page{height:100%;min-height:560px;display:flex;flex-direction:column;gap:18px;max-width:900px;margin:0 auto;
  padding-block:22px 26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;letter-spacing:.08em;color:var(--dim)}
.brand{display:flex;align-items:center;gap:12px;color:var(--fg);text-decoration:none}
.rotor{position:relative;width:46px;height:46px;flex:none}
.rotor i{position:absolute;inset:0;background:var(--fg);-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat}
.rotor .ghost{opacity:0}
.rotor .glow{position:absolute;inset:-6px;opacity:0;transition:opacity .6s;
  background:radial-gradient(ellipse 30% 14% at 28% 50%,rgba(255,210,63,.95),transparent 72%),radial-gradient(ellipse 30% 14% at 72% 50%,rgba(39,198,255,.95),transparent 72%);filter:blur(5px)}
.rotor.spin .glow{opacity:1}
.word{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.01em}
.word b{color:var(--blue);font-weight:600}
.dots{display:inline-flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;display:block}
.meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block}
.term{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);box-shadow:var(--elev);transition:border-color .4s,box-shadow .4s}
/* state frames: amber while a CYBER caution is active; a short gold flash when the hangar opens */
.term.caution{border-color:var(--y);box-shadow:0 0 0 1px rgba(255,210,63,.35),0 0 22px rgba(255,210,63,.28),var(--elev);animation:frame 2.4s ease-in-out infinite}
@keyframes frame{50%{box-shadow:0 0 0 1px rgba(255,210,63,.55),0 0 34px rgba(255,210,63,.42),var(--elev)}}
.term.gold{border-color:#e0b400;animation:goldflash 2.6s ease-out forwards}
@keyframes goldflash{0%{box-shadow:0 0 0 1px rgba(224,180,0,0),0 0 0 rgba(255,210,63,0),var(--elev)}18%{box-shadow:0 0 0 2px rgba(224,180,0,.7),0 0 48px rgba(255,210,63,.6),var(--elev)}100%{box-shadow:0 0 0 1px rgba(224,180,0,0),0 0 0 rgba(255,210,63,0),var(--elev)}}
@media (prefers-reduced-motion:reduce){.term.caution,.term.gold{animation:none}.term.gold{box-shadow:0 0 0 2px rgba(224,180,0,.6),0 0 30px rgba(255,210,63,.45),var(--elev)}}
.bar{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.bar>span{white-space:nowrap}
.bar-r{display:flex;align-items:center;gap:10px}
@media (max-width:400px){.bar .tty{display:none}.bar{letter-spacing:.06em}}
#state{color:var(--blue)}
#state.air{color:var(--yt)}
/* seatbelt sign: appears in flight */
.belt{display:none;align-items:center;justify-content:center;width:26px;height:18px;border:1px solid var(--t2);color:var(--t2);transition:color .3s,border-color .3s,box-shadow .3s}
.belt svg{width:13px;height:13px;display:block}
.belt.show{display:inline-flex}
.belt.on{color:var(--y);border-color:var(--y);box-shadow:0 0 10px rgba(255,210,63,.45)}
:root[data-theme="light"] .belt.on{color:#11161d;background:var(--y);box-shadow:0 0 10px rgba(255,210,63,.6)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .belt.on{color:#11161d;background:var(--y);box-shadow:0 0 10px rgba(255,210,63,.6)}}
.belt.flash{animation:beltflash .5s steps(1) 4}
@keyframes beltflash{50%{color:var(--t2);border-color:var(--t2);background:transparent;box-shadow:none}}
@media (prefers-reduced-motion:reduce){.belt.flash{animation:none}}
.ruler{height:8px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--t1) 0 1px,transparent 1px 11px),repeating-linear-gradient(90deg,var(--t2) 0 2px,transparent 2px 44px);background-size:auto 4px,auto 8px;background-repeat:repeat-x;background-position:0 4px,0 0;position:relative;transition:background-color .4s,box-shadow .4s}
/* easter eggs: exterior lights on the ruler */
/* aurora: the same ruler boxes as the light bar, one solid colour per 44px box, stepping along (pixelated) */
.ruler.aur{background-image:repeating-linear-gradient(90deg,var(--t1) 0 1px,transparent 1px 11px),repeating-linear-gradient(90deg,var(--t2) 0 2px,transparent 2px 44px),linear-gradient(90deg,#14e39a 0 44px,#19d6ab 44px 88px,#24d2d6 88px 132px,#2bb8ff 132px 176px,#4b8dff 176px 220px,#7a5cff 220px 264px,#a24dff 264px 308px,#7a5cff 308px 352px,#4b8dff 352px 396px,#24d2d6 396px 440px);background-size:auto 4px,auto 8px,440px 8px;background-repeat:repeat-x;background-position:0 4px,0 0,0 0;box-shadow:0 0 12px 2px rgba(20,227,154,.45),0 0 36px rgba(122,92,255,.3);animation:aur 5s steps(10) infinite;z-index:1}
@keyframes aur{to{background-position:0 4px,0 0,440px 0}}
@media (prefers-reduced-motion:reduce){.ruler.aur{animation:none}}
.ruler.lb{background-color:#2f6bff;box-shadow:0 0 12px 2px rgba(47,107,255,.65),0 0 36px rgba(47,107,255,.3);animation:hum 2.5s ease-in-out infinite;z-index:1}
@keyframes hum{50%{background-color:#4d82ff;box-shadow:0 0 18px 4px rgba(77,130,255,.8),0 0 54px rgba(77,130,255,.4)}}
.ruler::before,.ruler::after{content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;opacity:0;transition:opacity .3s;z-index:2}
.ruler::before{left:10px;background:#ff3b30;box-shadow:0 0 10px 3px rgba(255,59,48,.75)}
.ruler::after{right:10px;background:#22c55e;box-shadow:0 0 10px 3px rgba(34,197,94,.75)}
.ruler.nav::before,.ruler.nav::after{opacity:1;animation:strobe 1.6s steps(1) infinite}
@keyframes strobe{0%{background:#fff;box-shadow:0 0 16px 6px rgba(255,255,255,.95)}6%{background:#fff;box-shadow:0 0 16px 6px rgba(255,255,255,.95)}7%{background:inherit}}
.ruler.nav::before{animation-name:strobe-r}.ruler.nav::after{animation-name:strobe-g}
@keyframes strobe-r{0%,5%{background:#fff;box-shadow:0 0 16px 6px rgba(255,255,255,.95)}6%,100%{background:#ff3b30;box-shadow:0 0 10px 3px rgba(255,59,48,.75)}}
@keyframes strobe-g{0%,5%{background:#fff;box-shadow:0 0 16px 6px rgba(255,255,255,.95)}6%,100%{background:#22c55e;box-shadow:0 0 10px 3px rgba(34,197,94,.75)}}
@media (prefers-reduced-motion:reduce){.ruler.lb,.ruler.nav::before,.ruler.nav::after{animation:none}}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 20px 22px;cursor:text;scrollbar-width:thin;scrollbar-color:var(--t1) transparent}
#out{white-space:pre-wrap;word-break:break-word;margin:0}
#out,.cmdline{max-width:82ch}
.cmdline:focus-within .p b{color:var(--c)}
.l{min-height:1.65em}
.p{color:var(--blue)}.p b{color:var(--fg);font-weight:500}
.ok{color:var(--ok)}.y{color:var(--yt)}.c{color:var(--c)}.d{color:var(--dim)}.f{color:var(--fg)}.err{color:var(--err)}
.h{color:var(--fg);font-weight:500}
a{color:var(--c);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--fg)}
.cmdline{display:flex;align-items:baseline;gap:0;margin-top:2px}
.cmdline[hidden]{display:none}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;caret-color:var(--blue);padding:0;margin-left:.6ch}
.cursor{display:inline-block;width:.6em;height:1.15em;background:var(--blue);vertical-align:-.2em;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes roll{to{transform:rotate(360deg)}}
.term.roll{animation:roll 1.4s cubic-bezier(.45,0,.2,1)}
.rotor.burn .glow{opacity:1;filter:blur(7px) brightness(1.6)}
.bar-prog{color:var(--blue)}
.annun{display:flex;gap:6px}
.annun button{font:inherit;font-size:11px;font-weight:600;letter-spacing:.12em;padding:4px 8px;border:1px solid var(--t1);background:var(--off);color:var(--t2);cursor:default;line-height:1.2}
.annun button.on{background:var(--y);border-color:var(--y);color:#11161d;cursor:pointer;box-shadow:0 0 14px rgba(255,210,63,.55)}
.annun button.on.blink{animation:lamp .9s steps(1) infinite}
@keyframes lamp{50%{background:var(--dimy);border-color:var(--dimy);box-shadow:none}}
.live.caution{background:var(--y);box-shadow:0 0 8px var(--y)}
.amber{color:var(--yt)}
.game{white-space:normal;line-height:1.25;margin:4px 0 2px;user-select:none;-webkit-user-select:none;touch-action:none}
.game .hud{color:var(--body)}
.game .sky{display:block;white-space:pre;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 0}
.game .pl{color:var(--fg);font-weight:600}.game .sh{color:var(--ok)}
.game .cb{color:var(--cb)}.game .dr{color:var(--err)}.game .bd{color:var(--yt)}.game .pt{color:var(--ok);font-weight:600}.game .sp{color:var(--sp)}.game .gr{color:var(--t2)}
.game .msg{color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:inherit;font-size:12px;letter-spacing:.06em;background:transparent;color:var(--body);border:1px solid var(--line);padding:7px 12px;cursor:pointer;touch-action:manipulation;transition:color .15s,border-color .15s,transform .1s}
.chips button:hover{color:var(--fg);border-color:var(--blue)}
.chips button:active{color:var(--fg);border-color:var(--blue);background:var(--off);transform:scale(.96)}
#lamp-cyber{position:relative}#lamp-cyber::after{content:"";position:absolute;inset:-11px -6px}
.chips button b{color:var(--blue);font-weight:500;margin-right:6px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;letter-spacing:.08em;color:var(--dim)}
footer{align-items:center}
footer a{display:inline-flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;letter-spacing:.06em;padding:5px 10px;border:1px solid var(--line);transition:border-color .15s,color .15s}
footer a::after{content:"↗";color:var(--blue);transition:transform .15s}
footer a:hover{border-color:var(--blue);color:var(--fg)}
footer a:hover::after{transform:translate(2px,-2px)}
@media (max-width:600px){.meta .opt{display:none}.annun .x{display:none}.screen{padding:14px 14px 18px}body{font-size:14px}.page{min-height:520px}
  .chips button{min-height:44px}footer a{min-height:44px;padding:0 14px}}
@media (pointer:coarse){#cmd{font-size:16px}}
@media (prefers-reduced-motion:reduce){.chips button:active{transform:none}}
@media (prefers-reduced-motion:reduce){.annun button.on.blink{animation:none}.cursor{animation:none}.rotor .glow{transition:none}}
</style>
</head>
<body>


<div class="page">
  <h1 class="sr-only">CyberBen: aviation cybersafety and AI assurance</h1>
  <div id="sr" class="sr-only" aria-live="polite"></div>
  <header>
    <a class="brand" href="https://cybersafety.aero" target="_blank" rel="noopener" aria-label="CyberBen, cybersafety.aero">
      <span class="rotor" id="rotor" aria-hidden="true"><span class="glow"></span><i class="ghost" id="g2"></i><i class="ghost" id="g1"></i><i id="r0"></i></span>
      <span class="word">cyberben<b>.ai</b></span>
      <span class="dots" aria-hidden="true"><i style="background:var(--y)"></i><i style="background:var(--c)"></i></span>
    </a>
    <div class="meta"><div class="annun" aria-label="Annunciators"><button type="button" id="lamp-cyber" aria-label="CYBER caution light, off">CYBER</button><button type="button" class="x" id="lamp-gnss" tabindex="-1">GNSS</button><button type="button" class="x" id="lamp-adsb" tabindex="-1">ADS-B</button><button type="button" class="x" id="lamp-acars" tabindex="-1">ACARS</button></div><span class="live" id="liveDot" aria-hidden="true"></span><span id="sysText">SYS · SECURE</span><span class="opt">59°26′N 24°45′E</span></div>
  </header>

  <main class="term" aria-label="CyberBen terminal">
    <div class="bar"><span>ai@cyberben<span class="tty"> · tty1</span></span><span class="bar-r"><span class="belt" id="belt" role="img" aria-label="Fasten seatbelt sign"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="2.6" r="1.6" fill="currentColor" stroke="none"/><path d="M5 15V9.5C5 7 6.2 5.6 8 5.6S11 7 11 9.5V15"/><path d="M3.2 10.2h3.3M9.5 10.2h3.3"/><rect x="6.5" y="9.2" width="3" height="2" rx=".4" fill="currentColor" stroke="none"/></svg></span><span id="state">booting</span></span></div>
    <div class="ruler" aria-hidden="true"></div>
    <div class="screen" id="screen">
      <div id="out" role="log" aria-live="polite"></div>
      <form class="cmdline" id="line" hidden autocomplete="off">
        <span class="p"><b>ai</b>@cyberben:~$</span>
        <label for="cmd" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Command</label>
        <input id="cmd" spellcheck="false" autocapitalize="off" autocomplete="off" enterkeyhint="go">
      </form>
    </div>
  </main>

  <nav class="chips" id="chips" aria-label="Commands"></nav>
  <footer><span>© 2026 CyberBen · Tallinn, Estonia</span><span><a href="https://cybersafety.aero" target="_blank" rel="noopener">cybersafety.aero</a></span></footer>

async function type(html,text,speed=26){const d=add(html+'<span class="tt f"></span><span class="cursor"></span>');const t=d.querySelector('.tt');

function spin(user){if(spinning)return;spinning=true;const r=document.getElementById('rotor'),r0=document.getElementById('r0'),g1=document.getElementById('g1'),g2=document.getElementById('g2');

// ---------- game: airspace ----------
let gameOn=false;
function game(){return new Promise(resolve=>{
  gameOn=true;
  const box=add('');box.classList.add('game');box.setAttribute('aria-hidden','true');
  announce('AIRSPACE game started. It is a visual game: hold space or the up arrow to climb, Q or Escape to quit.');
  const probe=document.createElement('span');probe.textContent='MMMMMMMMMM';probe.style.visibility='hidden';box.appendChild(probe);const cw=probe.getBoundingClientRect().width/10||8.4;probe.remove();
  const W=Math.max(30,Math.min(64,Math.floor((screen.clientWidth-46)/cw))),H=12,PX=5;
  let best=0;try{best=+localStorage.getItem('cb-air-best')||0}catch(_){}
  const QK=matchMedia('(pointer:coarse)').matches?'tap a command button to quit':'Q to quit';
  const QUIPS={drone:'Drone strike. Should have filed a NOTAM.',bird:'Bird strike. Not a cyber issue. Still bad.',cb:'Flew into a thunderstorm. The weather radar was on; you were not.',ground:'Controlled flight into terrain. The terrain was not compromised.'};
  let S,timer=null,state='ready';
  function reset(){S={y:H/2-1,vy:0,t:0,dist:0,obs:[],shield:0,spoofT:0,inv:0,up:false,speed:.5,next:18,cause:''}}
  reset();
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  function spawn(){
    const r=Math.random();
    if(S.dist>2&&r<.12) S.obs.push({k:'sp',x:W,w:12});
    else if(r<.52){const gap=4,gy=rnd(1,H-2-gap);S.obs.push({k:'cb',x:W,w:2,gy,gap})}
    else if(r<.72) S.obs.push({k:'dr',x:W,y:rnd(0,H-3)});
    else if(r<.88) S.obs.push({k:'bd',x:W,y:rnd(0,H-3),dy:Math.random()<.5?-1:1});
    else S.obs.push({k:'pt',x:W,y:rnd(1,H-3)});
    S.next=rnd(13,21)-Math.min(5,Math.floor(S.dist/8));
  }
  function hit(cause){if(S.inv>0)return false;if(S.shield>0){S.shield--;S.inv=14;return false}S.cause=cause;return true}
  function step(){
    S.t++;const climb=(S.spoofT>0)?!S.up:S.up;
    S.vy+=climb?-.32:.2;S.vy=Math.max(-.85,Math.min(.85,S.vy));S.y+=S.vy;
    if(S.y<0){S.y=0;S.vy=0}
    S.speed=Math.min(1.1,.5+S.dist/60);S.dist+=S.speed*.1;if(S.inv>0)S.inv--;
    for(const o of S.obs){o.x-=S.speed;if(o.k==='bd'&&S.t%5===0){o.y+=o.dy;if(o.y<0||o.y>H-3)o.dy*=-1,o.y=Math.max(0,Math.min(H-3,o.y))}}
    S.obs=S.obs.filter(o=>o.x+(o.w||1)>0);
    if(--S.next<=0)spawn();
    const py=Math.round(S.y);
    if(py>=H-1)return over('ground');
    let inSpoof=false;
    for(const o of [...S.obs]){const x0=Math.round(o.x),x1=x0+(o.w||1)-1,touch=x1>=PX&&x0<=PX+1;if(!touch)continue;
      if(o.k==='sp'){inSpoof=true}
      else if(o.k==='cb'){if((py<o.gy||py>=o.gy+o.gap)&&hit('cb'))return over('cb')}
      else if(o.k==='pt'){if(o.y===py){S.shield=Math.min(3,S.shield+1);S.obs.splice(S.obs.indexOf(o),1)}}
      else if(o.y===py&&hit(o.k))return over(o.k)}
    if(inSpoof&&S.spoofT<=0){S.spoofT=1;lamp(true)}
    if(!inSpoof&&S.spoofT>0){S.spoofT=0;lamp(false)}
    draw();
  }
  function lamp(on){const c=document.getElementById('lamp-cyber'),g=document.getElementById('lamp-gnss');if(lit.size)return;[c,g].forEach(e=>e.classList.toggle('on',on));c.classList.toggle('blink',on)}
  function draw(msg){
    const g=Array.from({length:H},()=>Array(W).fill(null));
    const put=(x,y,ch,c)=>{x=Math.round(x);if(x>=0&&x<W&&y>=0&&y<H)g[y][x]=[ch,c]};
    for(let x=0;x<W;x++){const m=(x+Math.floor(S.dist*10))%8;put(x,H-1,m===0?'¦':'_','gr')}
    for(const o of S.obs){
      if(o.k==='sp'){for(let dx=0;dx<o.w;dx++)for(let y=0;y<H-1;y++)if((y+dx)%3===0)put(o.x+dx,y,'~','sp')}
      else if(o.k==='cb'){for(let dx=0;dx<o.w;dx++)for(let y=0;y<H-1;y++)if(y<o.gy||y>=o.gy+o.gap)put(o.x+dx,y,'▒','cb')}
      else put(o.x,o.y,o.k==='dr'?'x':o.k==='bd'?'v':'+',o.k)}
    const py=Math.round(S.y),blink=S.inv>0&&S.inv%2;
    if(!blink){put(PX,py,'=','pl');put(PX+1,py,'>','pl');if(S.shield>0)put(PX-1,py,'(','sh')}
    const rows=g.map(r=>r.map(c=>c?`<span class="${c[1]}">${c[0]}</span>`:' ').join('')).join('\n');
    const fl=String(Math.round((H-1-S.y)/(H-1)*400)).padStart(3,'0');
    const hud=`<span class="hud">FL${fl}  ·  ${S.dist.toFixed(1)} NM  ·  SHIELD ${S.shield?'<span class="sh">'+'●'.repeat(S.shield)+'</span>':'–'}  ·  BEST ${best.toFixed(1)} NM</span>`+(S.spoofT>0?'  <span class="amber">GNSS SPOOFED · CONTROLS INVERTED</span>':'');
    const foot=msg||`<span class="d">hold SPACE / ↑ or press to climb · ${QK}</span>`;
    box.innerHTML=hud+'<span class="sky">'+rows+'</span>'+foot;screen.scrollTop=screen.scrollHeight;
  }
  function over(cause){clearInterval(timer);timer=null;state='over';lamp(false);
    const d=S.dist;if(d>best){best=d;try{localStorage.setItem('cb-air-best',String(d))}catch(_){}}
    announce(`Crash. ${QUIPS[cause]} ${d.toFixed(1)} nautical miles flown. Press space to fly again or Q to quit.`);
    draw(`<span class="err">CRASH</span> <span class="msg">· ${QUIPS[cause]}</span><br><span class="d">${d.toFixed(1)} NM flown · SPACE or tap to fly again · ${QK}</span>`)}
  function start(){reset();state='run';draw();timer=setInterval(step,60)}
  function quit(){clearInterval(timer);gameOn=false;lamp(false);removeEventListener('keydown',kd,true);removeEventListener('keyup',ku,true);
    screen.removeEventListener('pointerdown',pd);removeEventListener('pointerup',pu);removeEventListener('pointercancel',pu);
    draw(`<span class="d">Flight logged · best ${best.toFixed(1)} NM</span>`);box.removeAttribute('aria-hidden');announce('Game closed.');resolve()}
  const climbKey=k=>k===' '||k==='ArrowUp'||k==='w'||k==='W';
  function kd(e){if(!gameOn)return;
    if(e.key==='q'||e.key==='Q'||e.key==='Escape'){e.preventDefault();e.stopPropagation();return quit()}
    if(climbKey(e.key)||e.key==='Enter'){e.preventDefault();e.stopPropagation();if(state!=='run'){if(!e.repeat)start();return}S.up=true}}
  function ku(e){if(!gameOn)return;if(climbKey(e.key)){e.preventDefault();S.up=false}}
  function pd(e){if(!gameOn)return;e.preventDefault();if(state!=='run'){start();return}S.up=true}
  function pu(){if(gameOn)S.up=false}
  addEventListener('keydown',kd,true);addEventListener('keyup',ku,true);screen.addEventListener('pointerdown',pd);addEventListener('pointerup',pu);addEventListener('pointercancel',pu);
  draw('<span class="msg">AIRSPACE · avoid drones <span class="dr">x</span>, birds <span class="bd">v</span> and storms <span class="cb">▒</span> · collect patches <span class="pt">+</span> · beware spoofing <span class="sp">~</span></span><br><span class="d">press SPACE or tap to take off · '+QK+'</span>');
})}

// clear = reboot of the simulation: back on stand, lights off, cautions cleared, checklist reset (theme, history, game best and coin flag stay)
function resetSim(){const was=ditched||inFlight||lit.size||navOn()||lbOn()||!!atis||lampDone;
  if(lit.size)clearCaution();ruler.classList.remove('nav','lb','aur');briefed=false;safetyDone=false;ditched=false;term.classList.remove('gold','caution');
  inFlight=false;atis='';lampDone=false;stateEl.textContent='ready';stateEl.classList.remove('air');belt.classList.remove('show','on','flash');return was}
// attack drills only run in flight; on the ground each says why
const GROUND={gps:'GNSS · 12 satellites · position steady at the stand.',adsb:'ADS-B IN · only ground traffic on the apron. Nothing to see down here.',acars:'ACARS · pre-departure clearance received and verified.',hack:'Aircraft on stand, systems cold. Try again in flight; we will stop you there too.'};
function grounded(k){return lines([GROUND[k],'<span class="d">Attack drills run in flight. Take off first:</span> <span class="c">checklist</span> <span class="d">·</span> <span class="c">navlights</span> <span class="d">·</span> <span class="c">atc</span>'])}const belt=document.getElementById('belt');
function ding(hi){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=chime.ac||(chime.ac=new A());const t=ac.currentTime,g=ac.createGain(),v=ac.createOscillator();
  v.type='sine';v.frequency.value=hi?1318:988;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+1.1);v.connect(g).connect(ac.destination);v.start(t);v.stop(t+1.2)}catch(_){}}
function setFlight(on){inFlight=on;if(!on){briefed=false;safetyDone=false}stateEl.textContent=on?'in-flight':'ready';stateEl.classList.toggle('air',on);
  if(on){belt.classList.add('show','on');belt.classList.remove('flash');void belt.offsetWidth;belt.classList.add('flash');ding(true)}
  else{ding(false);belt.classList.remove('on','flash');setTimeout(()=>{if(!inFlight)belt.classList.remove('show')},1200)}}
function metar(){const d=new Date(),p=n=>String(n).padStart(2,'0');let m=d.getUTCMinutes()>=50?50:d.getUTCMinutes()>=20?20:50,h=d.getUTCHours(),day=d.getUTCDate();
  if(m===50&&d.getUTCMinutes()<20){const e=new Date(d.getTime()-3600000);h=e.getUTCHours();day=e.getUTCDate()}
  return 'METAR EETN '+p(day)+p(h)+p(m)+'Z 24008KT 9999 FEW025 07/03 Q1012 NOSIG'}
const ruler=document.querySelector('.ruler');
function lightbar(on){ruler.classList.toggle('lb',on)}
const navOn=()=>ruler.classList.contains('nav'),lbOn=()=>ruler.classList.contains('lb');
async function briefing(){if(briefed)return;briefed=true;const m=metar().split(' ');const aur=ruler.classList.contains('aur');
  await lines(['<span class="y">PRE-FLIGHT BRIEFING</span> · CB-42','  route .......... EETN → EETN · local flight · runway 26','  weather ........ '+m.slice(3).join(' '),'  NOTAM .......... GNSS interference reported in the Baltic region','  cyber .......... ADS-B and ACARS are unauthenticated · verify by voice','  space weather .. '+(aur?'<span class="amber">aurora alert · Kp 6 · expect GNSS degradation</span>':'quiet'),'  crew ........... position lights '+(navOn()?'on':'<span class="amber">OFF</span>')+' · caution '+(lit.size?'<span class="amber">open</span>':'clear'),'  cabin .......... safety briefing '+(safetyDone?'given':'<span class="amber">not given</span> · passengers can ask: <span class="c">safety</span>'),''],90)}
function extLights(){const n=navOn(),b=lbOn();if(ruler.classList.contains('aur'))return '<span class="ok">aurora alert</span>'+(n?' · <span class="ok">position · strobes on</span>':' · position off');if(!n&&!b)return 'off · <span class="c">navlights</span> <span class="d">·</span> <span class="c">lightbar</span>';
  return [n?'<span class="ok">position · strobes on</span>':'position off',b?'<span class="ok">light bar on</span>':'light bar off'].join(' · ')}
function chime(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=chime.ac||(chime.ac=new A());const t=ac.currentTime;
  [0,.18,.36].forEach((o,i)=>{const g=ac.createGain(),v=ac.createOscillator();v.type='sine';v.frequency.value=i===2?988:880;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.08,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+.16);v.connect(g).connect(ac.destination);v.start(t+o);v.stop(t+o+.18)})}catch(_){}}
const term=document.querySelector('.term');
function goldFlash(){if(term.classList.contains('caution'))return;term.classList.remove('gold');void term.offsetWidth;term.classList.add('gold');clearTimeout(goldFlash.t);goldFlash.t=setTimeout(()=>term.classList.remove('gold'),2700)}
// flight data recorder: every attack drill this session (kept across clear, like a real recorder)
const LOG=[],LOGTXT={gnss:'GNSS spoofing · position jump to Null Island',adsb:'ADS-B ghost target GHOST1 · rejected',acars:'tampered ACARS uplink · divert to Null Island',hack:'intrusion attempt · ARINC 429 · cabin firewall'};
function logAttack(sys){const d=new Date(),p=n=>String(n).padStart(2,'0');LOG.push({sys,t:p(d.getUTCHours())+p(d.getUTCMinutes())+'Z'})}
function lastEntry(){const e=LOG[LOG.length-1];
  if(!e)return ['  last entry .............. "Who put the maintenance laptop on the IFE VLAN?"','  status .................. <span class="ok">fixed before take-off</span>'];
  const open=e.sys!=='hack'&&lit.has(e.sys);
  return ['  last entry .............. <span class="f">'+e.t+'</span> · '+LOGTXT[e.sys],'  status .................. '+(open?'<span class="amber">caution open</span> · <span class="c">ack</span>':e.sys==='hack'?'<span class="ok">access denied · contained</span>':'<span class="ok">contained · acknowledged</span>')]}
function caution(sys,why){lit.add(sys);logAttack(sys);term.classList.remove('gold');term.classList.add('caution');const c=document.getElementById('lamp-cyber');c.classList.add('on','blink');c.setAttribute('aria-label','CYBER caution light on: '+why+'. Press to acknowledge.');
  document.getElementById('lamp-'+sys).classList.add('on');document.getElementById('liveDot').classList.add('caution');document.getElementById('sysText').textContent='SYS · CAUTION';
  add(`<span class="amber">[CAUTION] CYBER</span> · ${why} · <span class="d">type</span> <span class="c">ack</span> <span class="d">or press the light</span>`);chime()}
function clearCaution(){lit.clear();term.classList.remove('caution');['cyber','gnss','adsb','acars'].forEach(i=>document.getElementById('lamp-'+i).classList.remove('on','blink'));
  const c=document.getElementById('lamp-cyber');c.setAttribute('aria-label','CYBER caution light, off');document.getElementById('liveDot').classList.remove('caution');document.getElementById('sysText').textContent='SYS · SECURE'}
document.getElementById('lamp-cyber').addEventListener('click',()=>{if(lit.size&&!busy)run('ack')});

const ALIAS={game:'play',flight:'play',fly2:'play',spoof:'gps','ads-b':'adsb',traffic:'adsb',tcas:'adsb',datalink:'acars',cancel:'ack','master-caution':'ack',test:'lamptest','light-bar':'lightbar',lightbar:'lightbar',bar:'lightbar','nav-lights':'navlights',nav:'navlights',wingtips:'navlights',wingtip:'navlights',strobes:'navlights',strobe:'navlights',tea:'coffee',brew:'coffee',tower:'atc',takeoff:'fly','take-off':'fly',landing:'land',touchdown:'land',doggo:'dog',eetn:'airport',gate:'airport',departures:'airport',wifi:'airport','wi-fi':'airport',uav:'uas',rpas:'uas',uncrewed:'uas',unmanned:'uas',quadcopter:'drone',quad:'drone',drones:'drone',heli:'helicopter',helo:'helicopter',chopper:'helicopter',rotorcraft:'helicopter',hems:'helicopter',ditch:'water',ditching:'water',splash:'water',splashdown:'water','safety-briefing':'safety',demo:'safety',cabin:'safety',puppy:'dog',k9:'dog',kitty:'pet',meow:'pet',purr:'pet',meal:'food',snack:'food',lunch:'food',dinner:'food',breakfast:'food',chicken:'food',pasta:'food',northernlights:'aurora',check:'checklist',checklists:'checklist',preflight:'checklist','pre-flight':'checklist',hack:'hack','?':'help',man:'help',about:'whoami',ai:'focus',lab:'research',cls:'clear',hi:'hello',hey:'hello','open':'contact',web:'contact'};
const NAMES=[...Object.keys(C),'cat focus.txt'];
// Tab completes only the commands listed in help (hidden ones stay hidden)
const TABS=['help','whoami','focus','research','services','contact','spin','theme','ls','cat','date','history','clear'];

const hist=[];let hi=-1;
async function run(raw){
  const s=raw.trim();busy=true;line.hidden=true;
  add(P+'<span class="f">'+esc(s)+'</span>');
  if(s){hist.push(s);hi=hist.length}
  const [name,...rest]=s.split(/\s+/);const low=s.toLowerCase();let key=ALIAS[name?.toLowerCase()]||name?.toLowerCase();
  if(/barrel roll/.test(low))key='barrel'; else if(/^(northern lights|aurora alert|space weather)/.test(low))key='aurora'; else if(/^pet the (cat|dog)/.test(low))key='pet'; else if(/^water ?landing/.test(low))key='water'; else if(/^(cabin )?safety( briefing| demo)?$/.test(low))key='safety'; else if(/^light ?bar/.test(low)){key='lightbar';rest.splice(0,rest.length,...low.replace(/^light ?bar/,'').trim().split(/\s+/))} else if(/^(nav|navigation|position) ?lights|^wing ?tips?/.test(low)){key='navlights';rest.splice(0,rest.length,...low.replace(/^(nav|navigation|position) ?lights|^wing ?tips?/,'').trim().split(/\s+/))} else if(/lamp ?test/.test(low))key='lamptest'; else if(/master caution/.test(low))key='ack'; else if(/^(make me a )?(coffee|tea)/.test(low))key='coffee'; else if(/hack( the)? plane/.test(low))key='hack';
  if(/^charlie[\s-]+oscar[\s-]+india[\s-]+november$/.test(low))key='__coin'; else if(/^challenge( coins?)?$/.test(low))key='coin';
  if(!s){} else if(key==='__coin') await coinBrief(); else if(C[key]) await C[key](rest.join(' ')); else if(s.split(/\s+/).length>=3||/\?$/.test(s)) await lines(['<span class="d">I\'m a scripted terminal, not a chatbot. No AI is answering here.</span>','Try <span class="c">help</span>, or ask a person at <a href="https://cybersafety.aero" target="_blank" rel="noopener">cybersafety.aero</a>.']); else add(`<span class="err">command not found:</span> ${esc(name)} <span class="d">· try</span> <span class="c">help</span>`);
  add('');busy=false;line.hidden=false;screen.scrollTop=screen.scrollHeight;if(!matchMedia('(pointer:coarse)').matches)cmd.focus({preventScroll:true});
}
function send(){const v=cmd.value;cmd.value='';if(!busy)run(v)}
line.addEventListener('submit',e=>{e.preventDefault();send()});
cmd.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send();return}
  if(e.key==='ArrowUp'){if(hi>0){hi--;cmd.value=hist[hi]}e.preventDefault()}
  else if(e.key==='ArrowDown'){if(hi<hist.length-1){hi++;cmd.value=hist[hi]}else{hi=hist.length;cmd.value=''}e.preventDefault()}
  else if(e.key==='Tab'&&!e.shiftKey){const v=cmd.value.toLowerCase();if(!v.trim())return; // empty line: let Tab move focus
    if(v.startsWith('cat ')){const q=v.slice(4);const f=Object.keys(FILES).filter(x=>q.startsWith('.')||!x.startsWith('.')).find(x=>x.startsWith(q));e.preventDefault();if(f)cmd.value='cat '+f;return}
    const m=TABS.filter(n=>n.startsWith(v));if(!m.length){e.preventDefault();return}/* text typed, nothing to complete: stay put; empty line or Shift+Tab still leaves */if(m.length===1&&m[0]!==v){e.preventDefault();cmd.value=m[0]}else if(m.length>1){e.preventDefault();add('<span class="d">'+m.join('   ')+'</span>')}}
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();if(!busy)C.clear()}
});
screen.addEventListener('click',()=>{if(!line.hidden&&!getSelection().toString())cmd.focus({preventScroll:true})});
const CHIPS=['help','whoami','focus','research','services','contact','spin'];
document.getElementById('chips').innerHTML=CHIPS.map(c=>`<button type="button" data-c="${c}"><b>$</b>${c}</button>`).join('');
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(gameOn){dispatchEvent(new KeyboardEvent('keydown',{key:'q'}));return}if(booting){skip=true;return}if(!busy)run(b.dataset.c)});

// ---------- konami: afterburner ----------
const KON=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let kp=0;
addEventListener('keydown',e=>{kp=(e.key===KON[kp]||e.key.toLowerCase()===KON[kp])?kp+1:(e.key===KON[0]?1:0);
  if(kp===KON.length){kp=0;if(booting||busy)return;afterburner()}});
async function afterburner(){busy=true;line.hidden=true;const r=document.getElementById('rotor'),r0=document.getElementById('r0'),g1=document.getElementById('g1'),g2=document.getElementById('g2');
  add('<span class="y">↑↑↓↓←→←→ B A</span>');add('<span class="ok">[ ok ]</span> afterburner engaged');r.classList.add('spin','burn');
  if(!reduce){const t0=performance.now();await new Promise(res=>{(function f(now){const tt=(now-t0)/1000,a=tt*1440;r0.style.transform=`rotate(${a}deg)`;g1.style.transform=`rotate(${a-12}deg)`;g2.style.transform=`rotate(${a-24}deg)`;g1.style.opacity=.35;g2.style.opacity=.2;
    if(tt<3.2)requestAnimationFrame(f);else{r0.style.transform='';g1.style.opacity=0;g2.style.opacity=0;res()}})(t0)})}
  r.classList.remove('spin','burn');
  await lines(['<span class="d">Note:</span> cheat codes are not an acceptable means of compliance.','']);busy=false;line.hidden=false;if(!matchMedia('(pointer:coarse)').matches)cmd.focus({preventScroll:true})}

// ---------- boot ----------
let booting=true;
addEventListener('keydown',e=>{if(booting&&!e.metaKey&&!e.ctrlKey)skip=true},{capture:true});
screen.addEventListener('pointerdown',()=>{if(booting)skip=true});
(async function boot(){
  add('<span class="d">CyberBen OS · Blueprint kernel · tty1</span>');await sleep(420);
  await dots('verifying model weights','<span class="f">ML-DSA-65 sig valid</span>');
  await dots('pq handshake','<span class="f">X25519MLKEM768</span>');
  await dots('isolating cabin wi-fi','<span class="f">segmented</span>');
  await dots('loading threat model','<span class="f">airworthiness security</span>');
  await dots('arming runtime monitor','<span class="f">online</span>');
  await dots('spinning up rotor','<span class="f">settled</span>',420);spin();
  add('');await sleep(380);
  const deep=linkCmd();
  if(!deep){
    await type(P,'whoami');await sleep(140);await C.whoami();add('');await sleep(420);
    await type(P,'cat focus.txt');await sleep(140);await C.focus();
  }
  add('<span class="d">Type</span> <span class="c">help</span><span class="d">, or tap a command below.</span>');add('');
  booting=false;skip=reduce;stateEl.textContent='ready';line.hidden=false;screen.scrollTop=screen.scrollHeight;
  if(deep)run(deep);else if(!matchMedia('(pointer:coarse)').matches)cmd.focus({preventScroll:true});
})();
// ---------- deep links: cyberben.ai/#play, #gps, #barrel-roll ----------
function linkCmd(){let h='';try{h=decodeURIComponent(location.hash.slice(1)).toLowerCase().replace(/[-_+]/g,' ').trim()}catch(_){}
  if(!h||h.length>40)return '';const k=h.split(' ')[0];
  return (C[k]||ALIAS[k]||/barrel roll|lamp ?test|hack( the)? plane/.test(h))?h:''}
addEventListener('hashchange',()=>{const c=linkCmd();if(c&&!busy&&!booting&&!gameOn)run(c)});
</script>
